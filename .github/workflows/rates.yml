name: Update exchange rates
on:
  schedule:
    - cron: "40 13 * * 0-5"
    - cron: "10 6 * * 0-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rates.yml"
      - ".github/scripts/rates.py"
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/rates.py
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update exchange rates" && git push)
