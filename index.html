<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZVI MYKOFF CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: nav rail on the right (RTL) + scrolling work area; record cards open as modals */
  --bg:#f2f4f9; --surface:#ffffff; --surface-2:#f6f7fb; --ink:#151c32; --muted:#5a6378; --line:#dfe3ed;
  --accent:#2340b5; --accent-ink:#ffffff; --accent-soft:#e5eafb; --gold:#d6950f;
  --ok:#15744c; --ok-soft:#e1f3ea; --warn:#9c6206; --warn-soft:#fbefd6; --bad:#b03026; --bad-soft:#fbe4e1;
  --font-display:"Rubik","Assistant",system-ui,sans-serif;
  --font-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --radius:10px; --shadow:0 10px 30px rgba(20,28,60,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2d; --surface-2:#1b2336; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2a3350;
  --accent:#8199ff; --accent-ink:#0e1320; --accent-soft:#232d4f; --gold:#f0b545;
  --ok:#5fd1a0; --ok-soft:#173528; --warn:#f2bb5c; --warn-soft:#3a2d12; --bad:#ff8a7f; --bad-soft:#40201d;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2d; --surface-2:#1b2336; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2a3350;
  --accent:#8199ff; --accent-ink:#0e1320; --accent-soft:#232d4f; --gold:#f0b545;
  --ok:#5fd1a0; --ok-soft:#173528; --warn:#f2bb5c; --warn-soft:#3a2d12; --bad:#ff8a7f; --bad-soft:#40201d;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.rail{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--font-display);font-size:17px;letter-spacing:.04em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{font-size:12px;color:var(--muted);font-weight:400}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted)}

.main{padding:20px 24px 60px;min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;flex:1;max-width:460px;min-width:220px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;max-height:380px;overflow:auto;display:none}
.results.show{display:block}
.results button{display:flex;width:100%;text-align:start;gap:10px;justify-content:space-between;padding:9px 14px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--surface-2)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-size:26px;font-weight:600}
.tile.alert{border-inline-start:4px solid var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.empty{padding:22px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.sub{display:block;font-size:12px;color:var(--muted)}

.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col h3{display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.lead .row{margin-top:6px;justify-content:space-between}

.modal-bg{position:fixed;inset:0;background:rgba(10,14,30,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;padding:20px}
.modal.wide{max-width:880px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-weight:400;font-size:15px}
.form textarea{min-height:70px;resize:vertical}
.form .req::after{content:" *";color:var(--bad)}
.picks{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.picks label{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--ink);padding:3px 0}
.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-bottom:14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:600}
.photo{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.sect{margin-top:16px}
.sect h3{margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}

.receipt{border:1px solid var(--line);border-radius:10px;padding:22px;background:#fff;color:#151c32}
.receipt .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #151c32;padding-bottom:12px;margin-bottom:14px}
.receipt table{min-width:0}
.receipt td{border-bottom:1px solid #e3e6ee;padding:7px 4px}
.receipt .tot{font-family:var(--font-display);font-size:22px}

.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.login[hidden]{display:none}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 30px;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.login-card h1{letter-spacing:.05em}
.gbtn{margin-top:14px;padding:11px 20px;gap:10px;font-size:16px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px;text-decoration:underline}
#who{margin-bottom:4px;word-break:break-all}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;inset:0 0 auto 0;border:0}
  .modal-bg{position:static;background:none;padding:0}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;padding:12px 16px;border-inline-end:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav a{white-space:nowrap;gap:6px}
  .rail-foot{margin-top:0}
  .main{padding:16px}
  .form{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
        <ellipse cx="20" cy="20" rx="7.5" ry="17" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
        <path d="M4 14h32M4 26h32M3 20h34" stroke="var(--gold)" stroke-width="1.8" fill="none"/>
      </svg>
      <div><b>ZVI MYKOFF</b><span>ניהול לקוחות ונסיעות</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot"><div id="who"></div><div id="saveState">מתחבר…</div></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="search">
        <input id="q" type="search" placeholder="חיפוש לקוח, ת.ז., דרכון, טלפון, מספר הזמנה…" autocomplete="off" aria-label="חיפוש">
        <div class="results" id="results"></div>
      </div>
      <div class="row">
        <button class="btn" data-act="newLead">+ ליד</button>
        <button class="btn" data-act="newBooking">+ הזמנה</button>
        <button class="btn pri" data-act="newCustomer">+ לקוח</button>
      </div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<div class="login" id="login" hidden>
  <div class="login-card">
    <svg width="64" height="64" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="var(--accent)" stroke-width="2.4"/><ellipse cx="20" cy="20" rx="7.5" ry="17" fill="none" stroke="var(--accent)" stroke-width="1.8"/><path d="M4 14h32M4 26h32M3 20h34" stroke="var(--gold)" stroke-width="1.8" fill="none"/></svg>
    <h1>ZVI MYKOFF</h1>
    <p class="muted">ניהול לקוחות ונסיעות</p>
    <button class="btn gbtn" data-act="signIn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>כניסה עם Google</button>
    <p class="small" id="loginErr" style="color:var(--bad)"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const fmtDate=iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const daysUntil=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(todayISO()+'T12:00:00'))/864e5);
const NF=new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0});
const money=n=>NF.format(Math.round(+n||0));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const vals=k=>Object.values(S[k]);

const TYPES={flight:'טיסה',hotel:'מלון',ground:'נסיעות פנים',other:'שירות אחר'};
const TYPE_PL={flight:'טיסות',hotel:'מלונות',ground:'נסיעות פנים',other:'אחר'};
const STATUS={quote:['הצעה',''],confirmed:['מאושר','acc'],done:['הושלם','ok'],cancelled:['בוטל','bad']};
const METHODS=['מזומן','כרטיס אשראי','העברה בנקאית','ביט','פייבוקס','צ׳ק'];
const CUR={ILS:'₪ שקל',USD:'$ דולר',EUR:'€ יורו'};
const STAGES=[['new','ליד חדש'],['contact','בטיפול'],['offer','הצעה נשלחה'],['won','נסגר'],['lost','לא רלוונטי']];
const VIEWS=[['dashboard','לוח בקרה'],['customers','לקוחות'],['bookings','הזמנות'],['leads','לידים'],['debts','חייבים לי'],['backup','גיבוי והגדרות']];

/* ---------- state ---------- */
const KINDS=['customers','bookings','payments','debts','leads'];
const S={customers:{},bookings:{},payments:{},debts:{},leads:{},meta:{}};
let backend=null, loadState='loading', readOnly=false;
const ui={type:'all',status:'all',custSort:'name'};

/* ---------- derived ---------- */
const rateOf=b=>b.currency&&b.currency!=='ILS'?(+b.rate||0):1;
const priceILS=b=>(+b.price||0)*rateOf(b);
const costILS=b=>(+b.cost||0)*rateOf(b);
const paidFor=bid=>vals('payments').filter(p=>p.bookingId===bid).reduce((a,p)=>a+(+p.amount||0),0);
const balance=b=>b.status==='cancelled'?0:Math.max(0,priceILS(b)-paidFor(b.id));
const custName=id=>{const c=S.customers[id];return c?(c.nameHe||c.nameEn||'ללא שם'):'לקוח שנמחק'};
const bookingCust=b=>(b.customerIds||[]).map(custName).join(', ')||'—';
const custBookings=id=>vals('bookings').filter(b=>(b.customerIds||[]).includes(id));
const custBalance=id=>vals('bookings').filter(b=>(b.customerIds||[])[0]===id).reduce((a,b)=>a+balance(b),0);
const debtLeft=d=>Math.max(0,(+d.amount||0)-(d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0));
function passPill(c,ref){
  if(!c.passportExp) return '<span class="pill">אין תוקף</span>';
  const base=ref||todayISO();
  if(c.passportExp<todayISO()) return '<span class="pill bad">פג תוקף</span>';
  if(c.passportExp<addMonths(base,6)) return `<span class="pill warn">${ref?'פחות מ-6 חודשים אחרי החזרה':'פג ב-'+fmtDate(c.passportExp)}</span>`;
  return `<span class="pill ok">${fmtDate(c.passportExp)}</span>`;
}
const statusPill=s=>{const [t,c]=STATUS[s]||STATUS.quote;return `<span class="pill ${c}">${t}</span>`};
const balPill=b=>{if(b.status==='cancelled')return '<span class="pill">—</span>';const r=balance(b);return r<=0.5?'<span class="pill ok">שולם</span>':`<span class="pill bad num">${money(r)}</span>`};
const route=b=>[b.from,b.to].filter(Boolean).join(' ← ');

/* ---------- storage ---------- */
function setSaveState(t){$('#saveState').textContent=t}
/* ===== הגדרות Firebase: מדביקים כאן את ה-config מהמסוף של Firebase ===== */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};
/* ========================================================================== */
let unsubs=[];
function boot(){
  render();
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){useLocal();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  firebase.auth().onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];
    if(!u){showLogin();return}
    $('#login').hidden=true;
    $('#who').innerHTML=`${esc(u.email||'')} · <button class="linkbtn" data-act="signOut">יציאה</button>`;
    KINDS.forEach(k=>S[k]={});S.meta={};loadState='loading';render();
    useDb(db,u.uid);
  });
}
function showLogin(){$('#login').hidden=false;$('#loginErr').textContent=''}
async function signIn(){
  const p=new firebase.auth.GoogleAuthProvider();
  try{await firebase.auth().signInWithPopup(p)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await firebase.auth().signInWithRedirect(p);return}catch(_){}}
    if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')$('#loginErr').textContent='הכניסה נכשלה ('+(e.code||'שגיאה')+'). נסי שוב.';
  }
}
function useDb(db,uid){
  const root=db.collection('users').doc(uid);
  const fresh=new Set(); let any=false;
  const timer=setTimeout(()=>{if(loadState!=='ready'){loadState=any?'stale':'unreachable';render()}},10000);
  const done=()=>{clearTimeout(timer);loadState='ready';setSaveState('הנתונים נשמרים אוטומטית');};
  const onErr=e=>{clearTimeout(timer);loadState='error';render();};
  KINDS.forEach(k=>unsubs.push(root.collection(k).onSnapshot({includeMetadataChanges:true},snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[k]=o;any=true;
    if(!snap.metadata.fromCache){fresh.add(k);if(fresh.size>KINDS.length)done();}
    if(loadState==='loading')loadState='cached';
    render();
  },onErr)));
  unsubs.push(root.onSnapshot({includeMetadataChanges:true},s=>{S.meta=s.exists?s.data():{};if(!s.metadata.fromCache){fresh.add('meta');if(fresh.size>KINDS.length)done();}render();},onErr));
  unsubs.push(()=>clearTimeout(timer));
  backend={
    save:(k,o)=>root.collection(k).doc(o.id).set(o),
    remove:(k,id)=>root.collection(k).doc(id).delete(),
    saveMeta:m=>root.set(m)
  };
}
function useLocal(){
  try{const raw=localStorage.getItem('zm-crm');if(raw)Object.assign(S,JSON.parse(raw));}catch(e){}
  const persist=()=>{try{localStorage.setItem('zm-crm',JSON.stringify(S))}catch(e){}};
  backend={save:async()=>persist(),remove:async()=>persist(),saveMeta:async()=>persist()};
  loadState='local';setSaveState('שמירה מקומית בדפדפן הזה בלבד');render();
}
function handleErr(e){
  const code=e&&e.code;
  if(code==='permission-denied'){toast('אין הרשאה לשמור. בדקי את כללי האבטחה ב-Firebase');}
  else if(code==='resource-exhausted'){toast('נגמרה מכסת השמירה היומית החינמית. נסי שוב מחר');}
  else if(code==='invalid-argument'){toast('הרשומה גדולה מדי. נסי צילום דרכון קטן יותר');}
  else toast('השמירה נכשלה. נסי שוב בעוד רגע');
  render();
}
async function saveRec(k,o){
  if(readOnly)return toast('מצב צפייה בלבד');
  o.updatedAt=Date.now(); S[k]={...S[k],[o.id]:o}; render();
  try{await backend.save(k,o)}catch(e){handleErr(e)}
}
async function removeRec(k,id){
  const n={...S[k]};delete n[id];S[k]=n;render();
  try{await backend.remove(k,id)}catch(e){handleErr(e)}
}
async function saveMeta(m){S.meta=m;try{await backend.saveMeta(m)}catch(e){handleErr(e)}}

/* ---------- search ---------- */
function search(t){
  t=t.trim().toLowerCase();const box=$('#results');if(!t){box.classList.remove('show');return}
  const has=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(t));
  const r=[
    ...vals('customers').filter(c=>has(c.nameHe,c.nameEn,c.idNum,c.passportNo,c.phone,c.email)).map(c=>[`openCustomer`,c.id,esc(c.nameHe)+` <span class="muted small" dir="ltr">${esc(c.nameEn)}</span>`,'לקוח']),
    ...vals('bookings').filter(b=>has(b.title,b.ref,b.supplier,b.to,b.from)).map(b=>['openBooking',b.id,esc(b.title)+` <span class="muted small">${esc(bookingCust(b))}</span>`,TYPES[b.type]]),
    ...vals('leads').filter(l=>has(l.name,l.phone,l.destination)).map(l=>['editLead',l.id,esc(l.name),'ליד']),
    ...vals('debts').filter(d=>has(d.name,d.reason,d.phone)).map(d=>['openDebt',d.id,esc(d.name),'חוב'])
  ].slice(0,20);
  box.innerHTML=r.length?r.map(([a,id,h,k])=>`<button data-act="${a}" data-id="${id}"><span>${h}</span><span class="pill">${k}</span></button>`).join(''):'<div class="empty small">לא נמצא</div>';
  box.classList.add('show');
}
$('#q').addEventListener('input',e=>search(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').classList.remove('show')});

  newCustomer:()=>customerForm(),editCustomer:d=>customerForm(d.id),openCustomer:d=>openCustomer(d.id),
  newBooking:d=>bookingForm(null,d.cust),editBooking:d=>bookingForm(d.id),openBooking:d=>openBooking(d.id),
  addPayment:d=>paymentForm(d.id),openReceipt:d=>openReceipt(d.id),itinerary:d=>itinerary(d.id),
  newLead:()=>leadForm(),editLead:d=>leadForm(d.id),
  moveLead:d=>{const l=clone(S.leads[d.id]);const i=STAGES.findIndex(s=>s[0]===(l.stage||'new'))+(+d.d);if(i<0||i>=STAGES.length)return;l.stage=STAGES[i][0];saveRec('leads',l)},
  leadToCustomer:async d=>{const l=S.leads[d.id];await saveRec('leads',{...clone(l),stage:'won'});customerForm();$('#f_nameHe').value=l.name||'';$('#f_phone').value=l.phone||'';$('#f_notes').value=[l.destination,l.dates,l.notes].filter(Boolean).join(' · ')},
  newDebt:()=>debtForm(),editDebt:d=>debtForm(d.id),openDebt:d=>openDebt(d.id),debtPay:d=>debtPayForm(d.id),
  fType:d=>{ui.type=d.v;render()},fStatus:d=>{ui.status=d.v;render()},
  del:async d=>{closeModal();if(await confirmBox('למחוק את הרשומה?','מחיקה'))removeRec(d.k,d.id)},
  delPayment:async d=>{closeModal();if(await confirmBox('לבטל את התשלום? הקבלה תימחק והיתרה תחזור.','ביטול תשלום'))removeRec('payments',d.id)},
  delBooking:async d=>{closeModal();const ps=vals('payments').filter(p=>p.bookingId===d.id);if(await confirmBox(`למחוק את ההזמנה${ps.length?' ואת '+ps.length+' התשלומים שלה':''}?`,'מחיקה')){for(const p of ps)await removeRec('payments',p.id);removeRec('bookings',d.id)}},
  delCustomer:async d=>{closeModal();const n=custBookings(d.id).length;if(await confirmBox(n?`ללקוח יש ${n} הזמנות. ההזמנות יישארו אבל בלי שם הלקוח. למחוק?`:'למחוק את הלקוח?','מחיקה'))removeRec('customers',d.id)},
  copy:async d=>{const t=$('#'+d.src).value;try{await navigator.clipboard.writeText(t);toast('הועתק')}catch(e){const el=$('#'+d.src);el.hidden=false;el.select();toast('סמני והעתיקי ידנית')}},
  saveBiz:()=>{saveMeta({...S.meta,bizName:$('#bizName').value.trim(),bizId:$('#bizId').value.trim(),bizPhone:$('#bizPhone').value.trim(),receiptNo:+$('#rcpt').value||1000});toast('נשמר')},
  exportData:()=>{const data=JSON.stringify({app:'zm-crm',v:1,at:new Date().toISOString(),meta:S.meta,...Object.fromEntries(KINDS.map(k=>[k,vals(k)]))});openModal('העתקת גיבוי',`<p class="small muted">מורידים את הקובץ ושומרים אותו בצד (למשל בגוגל דרייב). אפשר לשחזר ממנו דרך "שחזור מקובץ גיבוי".</p><textarea id="exp" style="width:100%;min-height:200px;direction:ltr;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)" readonly>${esc(data)}</textarea><div class="actions"><button class="btn pri" data-act="download" data-src="exp">הורדת קובץ גיבוי</button><button class="btn" data-act="copy" data-src="exp">העתקה</button></div>`)},
  loadDemo:async()=>{if(!(await confirmBox('להוסיף נתוני דוגמה? אפשר למחוק אותם אחר כך אחד-אחד.','הוספה')))return;await loadDemo();toast('נתוני הדוגמה נוספו')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();$('#results').classList.remove('show');const f=A[el.dataset.act];if(f)f(el.dataset)});
$('#modalBg').addEventListener('mousedown',e=>{if(e.target.id==='modalBg')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('change',async e=>{
  if(e.target.id!=='imp')return;const file=e.target.files[0];if(!file)return;
  try{const d=JSON.parse(await file.text());if(d.app!=='zm-crm')throw 0;
    const n=KINDS.reduce((a,k)=>a+(d[k]||[]).length,0);
    if(!(await confirmBox(`לשחזר ${n} רשומות מהגיבוי? רשומות קיימות עם אותו מזהה יעודכנו, שאר הרשומות יישארו.`,'שחזור')))return;
    for(const k of KINDS)for(const o of d[k]||[])await saveRec(k,o);
    if(d.meta)await saveMeta({...S.meta,...d.meta});toast('השחזור הושלם');
  }catch(err){toast('הקובץ לא נראה כמו גיבוי של המערכת')}
  e.target.value='';
});
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
